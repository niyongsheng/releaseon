<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="${app.name} + ' — 设备列表'">设备列表 — ReleaseOn</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
  <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
  <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">
  <link rel="stylesheet" th:href="@{/css/apple-tokens.css}">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--apple-font-text);
      color: var(--apple-ink);
      background: var(--apple-parchment);
      line-height: 1.47;
      letter-spacing: -0.374px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .device-card {
      width: 100%;
      max-width: 560px;
      background: var(--apple-canvas);
      border: 1px solid var(--apple-hairline);
      border-radius: var(--apple-radius-lg);
      padding: var(--apple-space-xl);
    }

    .device-card .card-header {
      text-align: center;
      margin-bottom: var(--apple-space-lg);
      padding-bottom: var(--apple-space-lg);
      border-bottom: 1px solid var(--apple-divider-soft);
    }

    .device-card .card-header .header-icon {
      margin-bottom: var(--apple-space-xs);
      color: var(--apple-ink-muted-48);
    }

    .device-card .card-header h4 {
      font-family: var(--apple-font-display);
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 0.231px;
      color: var(--apple-ink);
      margin: 0;
    }

    .device-card .card-header .app-name {
      font-size: 14px;
      color: var(--apple-ink-muted-48);
      letter-spacing: -0.224px;
      margin-top: 4px;
    }

    .device-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .device-list li {
      display: flex;
      align-items: center;
      gap: var(--apple-space-sm);
      padding: 12px 0;
      border-bottom: 1px solid var(--apple-divider-soft);
      font-size: 14px;
      letter-spacing: -0.224px;
      color: var(--apple-ink);
    }
    .device-list li:last-child { border-bottom: none; }
    .device-list li .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34c759;
      flex-shrink: 0;
    }
    .device-list li .udid {
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 12px;
      color: var(--apple-ink-muted-48);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .device-count {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      color: var(--apple-ink-muted-48);
      letter-spacing: -0.12px;
      margin-top: var(--apple-space-md);
      padding-top: var(--apple-space-md);
      border-top: 1px solid var(--apple-divider-soft);
      text-align: center;
      justify-content: center;
    }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .device-card { padding: var(--apple-space-lg); }
    }
  </style>
</head>

<body>

<div class="device-card">
  <div class="card-header">
    <div class="header-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
    </div>
    <h4>设备列表</h4>
    <div class="app-name" th:text="'应用: ' + ${app.name}">应用: App Name</div>
  </div>

  <ul class="device-list">
    <li th:each="device,appStat : ${app.devices}">
      <span class="dot"></span>
      <span class="udid" th:text="${device}">UDID</span>
    </li>
  </ul>

  <div class="device-count">
    <span th:text="${#lists.size(app.devices)} + ' 台已注册设备'">0 台已注册设备</span>
  </div>
</div>

</body>
</html>
