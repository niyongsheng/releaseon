<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>登录 — ReleaseOn</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
  <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
  <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">
  <link rel="stylesheet" th:href="@{/css/apple-tokens.css}">
  <script type="text/javascript" th:src="@{/js/jquery-1.11.0.min.js}"></script>
  <style>
    /* ══════════════════════════════════════════════════════
       Apple Design — Sign In Page
       ══════════════════════════════════════════════════════ */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--apple-font-text);
      color: var(--apple-ink);
      background: var(--apple-parchment);
      line-height: 1.47;
      letter-spacing: -0.374px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ─── Apple Global Nav ─── */
    .apple-global-nav {
      display: flex;
      align-items: center;
      height: 44px;
      padding: 0 24px;
      background: var(--apple-black);
      color: var(--apple-body-on-dark);
      font-size: 12px;
      letter-spacing: -0.12px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
    }
    .apple-global-nav .nav-logo {
      font-size: 16px;
      opacity: 0.9;
    }
    .apple-global-nav .nav-logo a {
      color: var(--apple-body-on-dark);
      text-decoration: none;
    }

    /* ─── Login Card ─── */
    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--apple-canvas);
      border: 1px solid var(--apple-hairline);
      border-radius: var(--apple-radius-lg);
      padding: var(--apple-space-xxl) var(--apple-space-xl);
    }

    .login-card .brand {
      text-align: center;
      margin-bottom: var(--apple-space-xl);
    }
    .login-card .brand .logo-mark {
      font-size: 32px;
      line-height: 1;
      margin-bottom: var(--apple-space-xs);
    }
    .login-card .brand h1 {
      font-family: var(--apple-font-display);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.14;
      color: var(--apple-ink);
    }
    .login-card .brand p {
      font-size: 14px;
      color: var(--apple-ink-muted-48);
      letter-spacing: -0.224px;
      margin-top: 4px;
    }

    .login-card label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.224px;
      color: var(--apple-ink-muted-48);
      margin-bottom: 6px;
    }
    .login-card input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--apple-hairline);
      border-radius: var(--apple-radius-md);
      font-family: var(--apple-font-text);
      font-size: 17px;
      letter-spacing: -0.374px;
      color: var(--apple-ink);
      background: var(--apple-canvas);
      transition: border-color 0.15s;
      margin-bottom: var(--apple-space-lg);
    }
    .login-card input:focus {
      outline: none;
      border-color: var(--apple-primary);
      box-shadow: 0 0 0 3px rgba(0,102,204,0.12);
    }

    /* ─── Password Toggle ─── */
    .password-wrapper {
      position: relative;
      margin-bottom: var(--apple-space-lg);
    }
    .password-wrapper input {
      padding-right: 44px;
      margin-bottom: 0;
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 0;
      bottom: 0;
      margin: auto 0;
      width: 22px;
      height: 22px;
      cursor: pointer;
      color: var(--apple-ink-muted-48);
      opacity: 0.6;
      transition: opacity 0.15s;
      background: none;
      border: none;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-password:hover { opacity: 1; }

    .login-card .btn-primary {
      display: block;
      width: 100%;
      padding: 13px;
      background: var(--apple-primary);
      color: #fff;
      border: none;
      border-radius: var(--apple-radius-pill);
      font-family: var(--apple-font-text);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.374px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
      line-height: 1;
    }
    .login-card .btn-primary:hover { background: var(--apple-primary-focus); }
    .login-card .btn-primary:active { transform: scale(0.97); }
    .login-card .btn-primary:focus-visible {
      outline: 2px solid var(--apple-primary-focus);
      outline-offset: 2px;
    }

    .login-card .btn-secondary {
      display: block;
      width: 100%;
      padding: 13px;
      margin-top: var(--apple-space-sm);
      background: transparent;
      color: var(--apple-primary);
      border: 1px solid var(--apple-primary);
      border-radius: var(--apple-radius-pill);
      font-family: var(--apple-font-text);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.374px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      line-height: 1;
      transition: transform 0.15s;
    }
    .login-card .btn-secondary:active { transform: scale(0.97); }

    .login-card .error-msg {
      font-size: 13px;
      color: #ec4242;
      text-align: center;
      margin-bottom: var(--apple-space-md);
      display: none;
    }

    /* ─── Footer ─── */
    .login-footer {
      margin-top: var(--apple-space-lg);
      text-align: center;
      font-size: 12px;
      color: var(--apple-ink-muted-48);
      letter-spacing: -0.12px;
    }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .login-card { padding: var(--apple-space-xl) var(--apple-space-lg); }
    }
  </style>
</head>

<body>

<!-- ═══ Apple Global Nav ═══ -->
<nav class="apple-global-nav">
  <span class="nav-logo"><a href="/">
    <svg width="18" height="18" viewBox="0 0 1024 1024" fill="currentColor" style="display:block;">
      <path d="M510.165333 233.685333l21.930667-36.650666c12.8-23.808 42.069333-31.146667 65.834667-18.304 23.765333 12.8 31.104 42.112 18.304 65.92l-208.469334 357.077333h149.930667c47.573333 0 75.008 56.746667 54.869333 97.024H175.530667A47.232 47.232 0 0 1 128 651.178667c0-27.477333 21.930667-47.616 47.530667-47.616h122.538666l157.226667-274.688-49.365333-86.058667c-12.8-23.808-5.461333-53.077333 18.304-65.92 23.765333-12.8 53.034667-5.461333 65.834666 18.346667l20.096 38.4z m-186.496 514.56l-45.738666 80.554667c-12.8 23.765333-42.026667 31.146667-65.834667 18.304-23.765333-12.8-31.061333-42.112-18.261333-65.92l34.730666-60.458667c38.4-12.8 71.338667-3.626667 95.104 27.477334z m398.634667-146.517333h126.165333c27.434667 0 47.530667 21.973333 47.530667 47.616 0 27.434667-21.930667 47.616-47.530667 47.616h-69.504l47.530667 82.346667c12.8 23.850667 5.504 53.12-18.261333 65.962666-23.765333 12.8-53.034667 5.504-65.834667-18.346666-78.634667-137.301333-138.965333-239.829333-177.365333-309.418667-40.234667-69.589333-10.965333-139.178667 16.469333-162.986667 31.061333 56.746667 78.592 139.178667 140.8 247.210667z"/>
    </svg>
  </a></span>
</nav>

<!-- ═══ Login Card ═══ -->
<div class="login-card">
  <div class="brand">
    <div class="logo-mark">
      <svg width="36" height="36" viewBox="0 0 1024 1024" fill="var(--apple-primary)" style="display:block;margin:0 auto;">
        <path d="M510.165333 233.685333l21.930667-36.650666c12.8-23.808 42.069333-31.146667 65.834667-18.304 23.765333 12.8 31.104 42.112 18.304 65.92l-208.469334 357.077333h149.930667c47.573333 0 75.008 56.746667 54.869333 97.024H175.530667A47.232 47.232 0 0 1 128 651.178667c0-27.477333 21.930667-47.616 47.530667-47.616h122.538666l157.226667-274.688-49.365333-86.058667c-12.8-23.808-5.461333-53.077333 18.304-65.92 23.765333-12.8 53.034667-5.461333 65.834666 18.346667l20.096 38.4z m-186.496 514.56l-45.738666 80.554667c-12.8 23.765333-42.026667 31.146667-65.834667 18.304-23.765333-12.8-31.061333-42.112-18.261333-65.92l34.730666-60.458667c38.4-12.8 71.338667-3.626667 95.104 27.477334z m398.634667-146.517333h126.165333c27.434667 0 47.530667 21.973333 47.530667 47.616 0 27.434667-21.930667 47.616-47.530667 47.616h-69.504l47.530667 82.346667c12.8 23.850667 5.504 53.12-18.261333 65.962666-23.765333 12.8-53.034667 5.504-65.834667-18.346666-78.634667-137.301333-138.965333-239.829333-177.365333-309.418667-40.234667-69.589333-10.965333-139.178667 16.469333-162.986667 31.061333 56.746667 78.592 139.178667 140.8 247.210667z"/>
      </svg>
    </div>
    <h1>登录</h1>
    <p>ReleaseOn 内测分发平台</p>
  </div>

  <form action="#">
    <label for="username">用户名</label>
    <input id="username" placeholder="输入用户名" />

    <label for="password">密码</label>
    <div class="password-wrapper">
      <input type="password" id="password" placeholder="密码" />
      <button class="toggle-password" id="togglePassword" type="button" aria-label="显示密码">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path id="eye-icon" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle id="eye-pupil" cx="12" cy="12" r="3"/>
        </svg>
        <svg width="22" height="22" id="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
          <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
        </svg>
      </button>
    </div>

    <div class="error-msg" id="errorMsg">用户名或密码错误</div>

    <button type="button" id="submit" class="btn-primary">登录</button>
    <a href="/account/signup" class="btn-secondary">注册</a>
  </form>
</div>

<div class="login-footer">
  ReleaseOn · Intranet App Distribution<br>
  <span style="opacity:0.6;">v[[${version}]]</span>
</div>

<script>
  $("#submit").click(function () {
    var data = {
      username: $("#username").val(),
      password: $("#password").val()
    };
    $.ajax({
      type: "POST",
      contentType: "application/json;charset=UTF-8",
      url: "/account/login",
      data: JSON.stringify(data),
      dataType: 'json',
      success: function(result) {
        if (result.code == 0) {
          window.location.href = "/apps";
        } else {
          $("#errorMsg").text(result.msg || "用户名或密码错误").show();
        }
      },
      error: function() {
        $("#errorMsg").text("登录失败，请重试").show();
      }
    });
  });

  // Enter key support
  $("#password").keypress(function(e) {
    if (e.which == 13) $("#submit").click();
  });

  // Toggle password visibility
  $("#togglePassword").click(function() {
    var input = $("#password");
    var isPassword = input.attr("type") === "password";
    input.attr("type", isPassword ? "text" : "password");
    $("#eye-icon, #eye-pupil").toggle();
    $("#eye-off-icon").toggle();
    $(this).attr("aria-label", isPassword ? "隐藏密码" : "显示密码");
  });
</script>

</body>
</html>
