<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title th:text="${app.name} + ' — ReleaseOn'">App 安装 — ReleaseOn</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
  <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
  <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">
  <link rel="stylesheet" th:href="@{/css/apple-tokens.css}">
  <script type="text/javascript" th:src="@{/js/qrcode.js}"></script>
  <script type="text/javascript" th:src="@{/js/jquery-1.11.0.min.js}"></script>
  <style>
    /* ══════════════════════════════════════════════════════
       Apple Design — Install Page (install.html)
       ══════════════════════════════════════════════════════ */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--apple-font-text);
      color: var(--apple-ink);
      background: var(--apple-parchment);
      line-height: 1.47;
      letter-spacing: -0.374px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .install-card {
      width: 100%;
      max-width: 420px;
      background: var(--apple-canvas);
      border: 1px solid var(--apple-hairline);
      border-radius: var(--apple-radius-lg);
      padding: var(--apple-space-xxl) var(--apple-space-xl);
      text-align: center;
    }

    /* App Icon */
    .install-icon {
      width: 80px;
      height: 80px;
      border-radius: 21%;
      margin: 0 auto var(--apple-space-md);
      overflow: hidden;
      box-shadow: 0 2px 16px rgba(0,0,0,0.10);
    }
    .install-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* App Name */
    .install-name {
      font-family: var(--apple-font-display);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.14;
      color: var(--apple-ink);
      margin-bottom: 4px;
    }
    .install-platform {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.12px;
      padding: 2px 12px;
      border-radius: var(--apple-radius-pill);
      margin-bottom: var(--apple-space-md);
    }
    .install-platform.ios { background: #f0f0f2; color: #636366; }
    .install-platform.android { background: #f0f7e8; color: #689f38; }

    /* Release Info */
    .install-version {
      font-size: 15px;
      font-weight: 500;
      color: var(--apple-ink-muted-48);
      letter-spacing: -0.224px;
      margin-bottom: 4px;
    }
    .install-date {
      font-size: 13px;
      color: var(--apple-ink-muted-48);
      letter-spacing: -0.12px;
      margin-bottom: var(--apple-space-lg);
    }

    .install-message {
      font-size: 14px;
      color: var(--apple-ink);
      letter-spacing: -0.224px;
      line-height: 1.5;
      margin-bottom: var(--apple-space-lg);
      padding: var(--apple-space-sm) var(--apple-space-md);
      background: var(--apple-parchment);
      border-radius: var(--apple-radius-md);
    }

    /* QR Code area */
    .install-qr {
      margin: var(--apple-space-lg) auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .install-qr #qrcode {
      display: inline-block;
      padding: 12px;
      background: #fff;
      border-radius: var(--apple-radius-md);
      border: 1px solid var(--apple-hairline);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.25s ease;
      cursor: pointer;
    }
    .install-qr #qrcode:hover {
      transform: scale(1.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    }
    .install-qr #qrcode:active {
      transform: scale(1.05);
    }
    .install-qr #qrcode img, .install-qr #qrcode canvas {
      display: block;
    }

    .scan-tip {
      font-size: 13px;
      color: var(--apple-ink-muted-48);
      letter-spacing: -0.12px;
      line-height: 1.5;
      margin-bottom: var(--apple-space-lg);
    }
    .scan-tip .text-black {
      color: var(--apple-ink);
      font-weight: 500;
      word-break: break-all;
    }

    /* Buttons */
    .install-actions {
      display: flex;
      flex-direction: column;
      gap: var(--apple-space-sm);
      margin-top: var(--apple-space-lg);
    }
    .install-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--apple-space-xs);
      width: 100%;
      padding: 14px 24px;
      border-radius: var(--apple-radius-pill);
      font-family: var(--apple-font-text);
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.374px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
      line-height: 1;
    }
    .install-btn:active { transform: scale(0.97); }
    .install-btn-primary {
      background: var(--apple-primary);
      color: #fff;
    }
    .install-btn-primary:hover { background: var(--apple-primary-focus); }
    .install-btn-secondary {
      background: transparent;
      color: var(--apple-primary);
      border: 1px solid var(--apple-primary);
    }
    .install-btn-secondary:hover { background: rgba(0,102,204,0.04); }
    .install-btn-ghost {
      background: var(--apple-parchment);
      color: var(--apple-ink-muted-48);
      font-size: 14px;
      font-weight: 400;
    }
    .install-btn-ghost:hover { background: var(--apple-hairline); }

    /* ═══ Background Patterns ═══ */
    body::before, body::after {
      content: '';
      position: fixed;
      pointer-events: none;
      z-index: -1;
    }
    body::before {
      top: -120px; left: -120px;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(0,102,204,0.06) 0%, transparent 70%);
      border-radius: 50%;
    }
    body::after {
      bottom: -80px; right: -80px;
      width: 240px; height: 240px;
      background: radial-gradient(circle, rgba(0,102,204,0.04) 0%, transparent 70%);
      border-radius: 50%;
    }

    /* ─── Responsive ─── */
    @media (max-width: 480px) {
      body { padding: 16px; }
      .install-card { padding: var(--apple-space-xl) var(--apple-space-lg); }
      .install-name { font-size: 24px; }
    }

    /* ─── Browser Warning ─── */
    .browser-warning {
      display: none;
      margin-top: var(--apple-space-lg);
      padding: var(--apple-space-md);
      background: #fff8e1;
      border: 1px solid #ffe082;
      border-radius: var(--apple-radius-md);
      font-size: 13px;
      color: #8d6e28;
      letter-spacing: -0.12px;
      line-height: 1.5;
      text-align: left;
    }
    .browser-warning strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }
    .browser-warning.show {
      display: block;
    }
  </style>
</head>

<body>

<div class="install-card">
  <!-- App Icon -->
  <div class="install-icon">
    <img th:src="${app.icon}" alt="icon" itemprop="image" />
  </div>

  <!-- Platform Badge -->
  <span class="install-platform"
        th:classappend="${#strings.containsIgnoreCase(app.platform,'ios')} ? 'ios' : 'android'"
        th:text="${#strings.containsIgnoreCase(app.platform,'ios')} ? 'iOS' : 'Android'">
    iOS
  </span>

  <!-- App Name -->
  <h1 class="install-name" th:text="${app.name}">App Name</h1>

  <!-- Package Type & Version -->
  <div class="install-version" th:text="${app.currentPackage.type} + ' · ' + ${app.version} + ' (Build ' + ${app.buildVersion} + ')'">
    Release · 1.0 (Build 1)
  </div>

  <!-- Size & Date -->
  <div class="install-date" th:text="${app.currentPackage.displaySize} + ' · ' + ${app.currentPackage.displayTime}">
    12MB · 2025-01-01
  </div>

  <!-- Release Message -->
  <div class="install-message" th:if="${app.currentPackage.message != null and !app.currentPackage.message.isEmpty()}"
       th:text="${app.currentPackage.message}">
    更新说明
  </div>

  <!-- QR Code -->
  <div class="install-qr">
    <div id="qrcode" th:data="${app.currentPackage.previewURL}"></div>
  </div>
  <p class="scan-tip">
    扫描二维码下载<br />
    <span class="text-black" th:text="${app.installPath}">https://example.com/s/abc</span>
  </p>

  <!-- Action Buttons -->
  <div class="install-actions">
    <input id="installURL" type="hidden" th:value="${app.currentPackage.installURL}" />
    <button class="install-btn install-btn-primary" id="install">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      下载安装
    </button>


    <div th:if="${app.currentPackage.deviceCount > 0}">
      <input id="devices" type="hidden" th:value="${basePath} + 'devices/' + ${app.currentPackage.id}" />
      <button class="install-btn install-btn-ghost" id="showDevices">
        查看设备列表 ([[${app.currentPackage.deviceCount}]])
      </button>
    </div>

  </div>

  <!-- Browser Warning (iOS only) -->
  <div class="browser-warning" id="browserWarning" th:if="${#strings.containsIgnoreCase(app.platform,'ios')}">
    <strong>⚠️ 请使用 iOS Safari 浏览器</strong>
    iOS 应用安装需要 iOS Safari 浏览器。请在 iPhone 或 iPad 上使用 Safari 打开此页面下载安装。
  </div>

  <!-- Browser Warning (Android only) -->
  <div class="browser-warning" id="browserWarningAndroid" th:if="${#strings.containsIgnoreCase(app.platform,'android')}">
    <strong>⚠️ 请使用手机浏览器</strong>
    请在 Android 手机上使用浏览器打开此页面以下载 APK 文件。
  </div>

</div>

<script>
  /* ─── Browser Detection ─── */
  (function() {
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    var isAndroid = /Android/.test(navigator.userAgent);
    var isSafari = /Safari/.test(navigator.userAgent) && !/Chrome/.test(navigator.userAgent) && !/CriOS/.test(navigator.userAgent);

    var warningEl = document.getElementById('browserWarning');
    var warningAndroid = document.getElementById('browserWarningAndroid');

    if (warningEl && !(isIOS && isSafari)) {
      warningEl.classList.add('show');
    }
    if (warningAndroid && !(isAndroid || isIOS)) {
      warningAndroid.classList.add('show');
    }
  })();

  /* ─── Button Actions ─── */
  $("#install").click(function () {
    window.location.href = $("#installURL").val();
  });
  $("#showDevices").click(function () {
    window.open($("#devices").val());
  });

  /* ─── QR Code ─── */
  var codeData = $("#qrcode").attr("data");
  new QRCode("qrcode", {
    text: codeData,
    width: 180,
    height: 180,
    colorDark: '#1d1d1f',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.L
  });
</script>

</body>
</html>
