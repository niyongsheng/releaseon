<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的应用 — ReleaseOn</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
  <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">
  <link rel="apple-touch-icon" th:href="@{/images/apple-touch-icon.png}">
  <link rel="stylesheet" th:href="@{/css/apple-tokens.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/jquery.toast.css}">
  <script type="text/javascript" th:src="@{/js/jquery-1.11.0.min.js}"></script>
  <script type="text/javascript" th:src="@{/js/jquery.toast.js}"></script>
  <style>
    /* ══════════════════════════════════════════════════════
       Apple Design — Apps Index Page
       Source: doc/design_token.html
       ══════════════════════════════════════════════════════ */

    /* ─── Reset & Base ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      font-family: var(--apple-font-text);
      color: var(--apple-ink);
      background: var(--apple-parchment);
      line-height: 1.47;
      letter-spacing: -0.374px;
      min-height: 100vh;
    }

    /* ─── Apple Global Nav ─── */
    .apple-global-nav {
      display: flex;
      align-items: center;
      height: 44px;
      padding: 0 24px;
      background: var(--apple-black);
      color: var(--apple-body-on-dark);
      font-size: 12px;
      font-weight: 400;
      letter-spacing: -0.12px;
      line-height: 1;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .apple-global-nav .nav-logo {
      font-size: 16px;
      opacity: 0.9;
    }
    .apple-global-nav .nav-logo a {
      color: var(--apple-body-on-dark);
      text-decoration: none;
    }
    .apple-global-nav .nav-links {
      display: flex;
      gap: 4px;
    }
    .apple-global-nav .nav-links a {
      color: var(--apple-body-on-dark);
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.15s;
    }
    .apple-global-nav .nav-links a:hover {
      opacity: 1;
    }
    .apple-global-nav .nav-spacer {
      flex: 1;
    }
    .apple-global-nav .nav-token-display {
      font-size: 11px; color: #636366; letter-spacing: -0.12px;
      margin-right: 12px; white-space: nowrap;
    }
    .apple-global-nav .nav-avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      color: #f5f5f7;
      font-size: 13px;
      font-weight: 600;
      user-select: none;
    }
    .apple-global-nav .nav-dropdown {
      position: relative;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: var(--apple-radius-xs);
      user-select: none;
    }
    .apple-global-nav .nav-dropdown:hover { background: rgba(255,255,255,0.08); }
    .apple-global-nav .nav-dropdown-icon { font-size: 8px; color: #636366; transition: transform 0.2s; }
    .apple-global-nav .nav-dropdown.open .nav-dropdown-icon { transform: rotate(180deg); }
    .nav-dropdown-menu {
      display: none;
      position: absolute; top: 100%; right: 0;
      min-width: 160px;
      background: rgba(30,30,30,0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--apple-radius-md);
      padding: 4px 0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 200;
    }
    .nav-dropdown.open .nav-dropdown-menu { display: block; }
    .dropdown-item {
      padding: 8px 16px; font-size: 12px; color: #e8e8ed;
      cursor: pointer; white-space: nowrap;
      transition: background 0.1s;
    }
    .dropdown-item:hover { background: rgba(255,255,255,0.08); }
    .dropdown-item-danger { color: #ec4242; }
    .dropdown-username { color: #f5f5f7; font-weight: 600; cursor: default; }
    .dropdown-username:hover { background: transparent !important; }
    .dropdown-item-admin { color: var(--apple-primary-on-dark); }
    .dropdown-divider { height: 1px; margin: 4px 8px; background: rgba(255,255,255,0.08); }

    .apple-global-nav .nav-logout {
      color: var(--apple-body-on-dark);
      text-decoration: none;
      font-size: 12px;
      opacity: 0.6;
      transition: opacity 0.15s;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      letter-spacing: -0.12px;
      padding: 0;
    }
    .apple-global-nav .nav-logout:hover {
      opacity: 1;
    }

    /* ─── Frosted Sub-Nav ─── */
    .apple-sub-nav {
      display: flex;
      align-items: center;
      height: 56px;
      padding: 0 24px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--apple-hairline);
      gap: 12px;
      position: sticky;
      top: 44px;
      z-index: 99;
    }
    .apple-sub-nav .sub-title {
      font-family: var(--apple-font-display);
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 0.231px;
      color: var(--apple-ink);
      line-height: 1.19;
    }

    /* ─── Content Wrapper ─── */
    .apple-content {
      max-width: 1100px;
      margin: 0 auto;
      padding: var(--apple-space-xxl) var(--apple-space-lg);
    }

    /* ─── Section Header ─── */
    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: var(--apple-space-lg);
    }
    .section-header h2 {
      font-family: var(--apple-font-display);
      font-size: var(--apple-space-lg);
      font-weight: 600;
      letter-spacing: -0.374px;
      color: var(--apple-ink);
    }
    .section-header .count {
      font-size: 14px;
      color: var(--apple-ink-muted-48);
      letter-spacing: -0.224px;
    }

    /* ─── App Grid ─── */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--apple-space-lg);
    }

    /* ─── Upload Card ─── */
    .upload-card {
      position: relative;
      height: 380px;
      background: var(--apple-canvas);
      border: 2px dashed var(--apple-hairline);
      border-radius: var(--apple-radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.2s;
      user-select: none;
    }
    .upload-card:hover {
      border-color: var(--apple-primary);
      background: rgba(0, 102, 204, 0.03);
      transform: translateY(-2px);
    }
    .upload-card:active {
      transform: scale(0.98);
    }
    .upload-card .upload-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--apple-parchment);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--apple-space-md);
      transition: background 0.2s;
    }
    .upload-card:hover .upload-icon {
      background: var(--apple-primary);
    }
    .upload-card .upload-icon svg {
      width: 24px;
      height: 24px;
      color: var(--apple-ink-muted-48);
      transition: color 0.2s;
    }
    .upload-card:hover .upload-icon svg {
      color: #fff;
    }
    .upload-card .upload-label {
      font-size: 17px;
      font-weight: 400;
      color: var(--apple-ink-muted-48);
      letter-spacing: -0.374px;
    }
    .upload-card .upload-hint {
      font-size: 12px;
      color: var(--apple-ink-muted-48);
      margin-top: var(--apple-space-xs);
      letter-spacing: -0.12px;
      opacity: 0.6;
    }
    .upload-card .upload-dragover {
      display: none;
      font-size: 17px;
      color: var(--apple-primary);
      font-weight: 600;
    }
    .upload-card.drag-over .upload-label,
    .upload-card.drag-over .upload-icon,
    .upload-card.drag-over .upload-hint {
      display: none;
    }
    .upload-card.drag-over .upload-dragover {
      display: block;
    }

    /* ─── App Card ─── */
    .app-card {
      background: var(--apple-canvas);
      border: 1px solid var(--apple-hairline);
      border-radius: var(--apple-radius-lg);
      padding: var(--apple-space-xl);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .app-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    /* Platform accent stripe */
    .app-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
    }
    .app-card.card-ios::before {
      background: #a6a6a8;
    }
    .app-card.card-android::before {
      background: #a4c639;
    }

    /* Card top: icon + name */
    .app-card-top {
      display: flex;
      align-items: flex-start;
      gap: var(--apple-space-md);
      margin-bottom: var(--apple-space-lg);
    }
    .app-card-icon {
      width: 64px;
      height: 64px;
      border-radius: 17.54%;
      flex-shrink: 0;
      overflow: hidden;
    }
    .app-card-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .app-card-meta {
      flex: 1;
      min-width: 0;
    }
    .app-card-name {
      font-family: var(--apple-font-display);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.2;
      color: var(--apple-ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .app-card-name:hover {
      color: var(--apple-primary);
    }
    .app-card-platform {
      display: inline-block;
      margin-top: var(--apple-space-xs);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.12px;
      padding: 2px 10px;
      border-radius: var(--apple-radius-pill);
    }
    .app-card-platform.ios {
      background: #f0f0f2;
      color: #636366;
    }
    .app-card-platform.android {
      background: #f0f7e8;
      color: #689f38;
    }

    /* Card details */
    .app-card-details {
      display: flex;
      flex-direction: column;
      gap: var(--apple-space-xs);
      margin-bottom: var(--apple-space-lg);
    }
    .app-card-detail {
      display: flex;
      align-items: center;
      gap: var(--apple-space-xs);
      font-size: 13px;
      letter-spacing: -0.12px;
    }
    .app-card-detail .label {
      color: var(--apple-ink-muted-48);
      min-width: 56px;
      flex-shrink: 0;
    }
    .app-card-detail .value {
      color: var(--apple-ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }
    .app-card-detail .value a {
      color: var(--apple-primary);
      text-decoration: none;
    }
    .app-card-detail .value a:hover {
      text-decoration: underline;
    }
    .app-card-detail .value.code {
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 12px;
      background: var(--apple-parchment);
      padding: 1px 6px;
      border-radius: var(--apple-radius-xs);
    }
    .app-card-detail .value.code a {
      color: var(--apple-primary);
    }

    /* Card actions */
    .app-card-actions {
      display: flex;
      align-items: center;
      gap: var(--apple-space-xs);
      padding-top: var(--apple-space-md);
      border-top: 1px solid var(--apple-divider-soft);
    }
    .app-card-actions .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 14px;
      border-radius: var(--apple-radius-pill);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.12px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid transparent;
      background: transparent;
      color: var(--apple-ink-muted-48);
      line-height: 1;
    }
    .app-card-actions .action-btn:hover {
      color: var(--apple-primary);
      border-color: var(--apple-primary);
      background: rgba(0, 102, 204, 0.04);
    }
    .app-card-actions .action-btn:active {
      transform: scale(0.95);
    }
    .app-card-actions .action-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    .app-card-actions .action-spacer {
      flex: 1;
    }
    .app-card-actions .action-delete {
      color: var(--apple-ink-muted-48);
      border: none;
      padding: 6px;
      border-radius: 50%;
    }
    .app-card-actions .action-delete:hover {
      color: #ec4242;
      background: rgba(236, 66, 66, 0.06);
      border-color: transparent;
    }

    /* ─── Toast Overrides ─── */
    .jq-toast-wrap { font-family: var(--apple-font-text); }
    .jq-toast-single { font-size: 14px; padding: 12px 20px; border-radius: var(--apple-radius-md); }

    /* ─── Responsive ─── */
    @media (max-width: 900px) {
      .app-grid {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      }
    }
    @media (max-width: 640px) {
      .apple-global-nav {
        padding: 0 16px;
        gap: 16px;
      }
      .apple-sub-nav {
        padding: 0 16px;
        height: 48px;
      }
      .apple-sub-nav .sub-title {
        font-size: 18px;
      }
      .apple-content {
        padding: var(--apple-space-lg) var(--apple-space-sm);
      }
      .app-grid {
        grid-template-columns: 1fr;
        gap: var(--apple-space-md);
      }
      .upload-card {
        height: 280px;
      }
      .app-card {
        padding: var(--apple-space-lg);
      }
      .apple-global-nav .nav-token-display,
      .apple-global-nav .nav-dropdown-icon {
        display: none;
      }
    }
    @media (max-width: 420px) {
      .apple-global-nav .nav-links {
        display: none;
      }
    }
  </style>

  <style>
    /* ─── Toast Overrides ─── */
    .jq-toast-wrap {
      font-family: var(--apple-font-text, -apple-system, system-ui, sans-serif);
    }
    .jq-toast-single {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.224px;
      line-height: 1.4;
      padding: 14px 18px;
      border-radius: 12px;
      background: rgba(0,0,0,0.82) !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff !important;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
      border: none;
    }
    .jq-toast-single h2 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.224px;
      margin-bottom: 4px;
    }
    .jq-toast-single.jq-icon-error { background: rgba(236, 66, 66, 0.92) !important; }
    .jq-toast-single.jq-icon-success { background: rgba(52, 199, 89, 0.92) !important; }
    .jq-toast-single.jq-icon-info { background: rgba(0, 102, 204, 0.92) !important; }

    /* ─── Confirm Dialog ─── */
    .confirm-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .confirm-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .confirm-dialog {
      background: var(--apple-canvas, #fff);
      border-radius: 14px;
      padding: 24px 28px 20px;
      max-width: 300px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.15);
      transform: scale(0.92);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .confirm-overlay.active .confirm-dialog {
      transform: scale(1);
    }
    .confirm-dialog .confirm-icon {
      font-size: 40px;
      margin-bottom: 12px;
      line-height: 1;
    }
    .confirm-dialog .confirm-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.374px;
      margin-bottom: 6px;
      color: var(--apple-ink, #1d1d1f);
    }
    .confirm-dialog .confirm-msg {
      font-size: 13px;
      color: var(--apple-ink-muted-48, #86868b);
      letter-spacing: -0.12px;
      line-height: 1.4;
      margin-bottom: 20px;
    }
    .confirm-dialog .confirm-actions {
      display: flex;
      gap: 8px;
    }
    .confirm-dialog .confirm-actions button {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: transform 0.15s;
      line-height: 1;
    }
    .confirm-dialog .confirm-actions button:active {
      transform: scale(0.96);
    }
    .confirm-dialog .btn-cancel {
      background: var(--apple-parchment, #f5f5f7);
      color: var(--apple-ink, #1d1d1f);
    }
    .confirm-dialog .btn-confirm {
      background: #ec4242;
      color: #fff;
    }
  </style>
</head>

<body>

<!-- ═══ Apple Global Nav ═══ -->
<nav class="apple-global-nav">
  <span class="nav-logo"><a href="/apps">
    <svg width="18" height="18" viewBox="0 0 1024 1024" fill="currentColor" style="display:block;">
      <path d="M510.165333 233.685333l21.930667-36.650666c12.8-23.808 42.069333-31.146667 65.834667-18.304 23.765333 12.8 31.104 42.112 18.304 65.92l-208.469334 357.077333h149.930667c47.573333 0 75.008 56.746667 54.869333 97.024H175.530667A47.232 47.232 0 0 1 128 651.178667c0-27.477333 21.930667-47.616 47.530667-47.616h122.538666l157.226667-274.688-49.365333-86.058667c-12.8-23.808-5.461333-53.077333 18.304-65.92 23.765333-12.8 53.034667-5.461333 65.834666 18.346667l20.096 38.4z m-186.496 514.56l-45.738666 80.554667c-12.8 23.765333-42.026667 31.146667-65.834667 18.304-23.765333-12.8-31.061333-42.112-18.261333-65.92l34.730666-60.458667c38.4-12.8 71.338667-3.626667 95.104 27.477334z m398.634667-146.517333h126.165333c27.434667 0 47.530667 21.973333 47.530667 47.616 0 27.434667-21.930667 47.616-47.530667 47.616h-69.504l47.530667 82.346667c12.8 23.850667 5.504 53.12-18.261333 65.962666-23.765333 12.8-53.034667 5.504-65.834667-18.346666-78.634667-137.301333-138.965333-239.829333-177.365333-309.418667-40.234667-69.589333-10.965333-139.178667 16.469333-162.986667 31.061333 56.746667 78.592 139.178667 140.8 247.210667z"/>
    </svg>
  </a></span>
  <div class="nav-links">
    <a href="/apps">ReleaseOn</a>
  </div>
  <span class="nav-spacer"></span>
  <span class="nav-token-display" th:text="'Token: ' + ${token}" th:unless="${#strings.isEmpty(token)}"></span>
  <div class="nav-dropdown" onclick="toggleDropdown(event)">
    <span class="nav-avatar" th:title="${username}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </span>
    <span class="nav-dropdown-icon">▾</span>
    <div class="nav-dropdown-menu" id="navDropdownMenu">
      <div class="dropdown-item dropdown-username" th:text="${username}">admin</div>
      <div class="dropdown-divider"></div>
      <div class="dropdown-item" onclick="event.stopPropagation();copyToken()">复制 Token</div>
      <div class="dropdown-item dropdown-item-admin" th:if="${isAdmin}" onclick="event.stopPropagation();window.location.href='/admin/users'">用户管理</div>
      <div class="dropdown-item" th:unless="${isAdmin}" style="color:var(--apple-ink-muted-48);cursor:default;">普通用户</div>
      <div class="dropdown-divider"></div>
      <div class="dropdown-item dropdown-item-danger" onclick="event.stopPropagation();logout()">退出登录</div>
    </div>
  </div>
</nav>

<!-- ═══ Frosted Sub-Nav ═══ -->
<div class="apple-sub-nav">
  <span class="sub-title">我的应用</span>
</div>

<!-- ═══ Main Content ═══ -->
<main class="apple-content">

  <!-- Section Header -->
  <div class="section-header" th:if="${not #lists.isEmpty(apps)}">
    <h2>全部应用</h2>
    <span class="count" th:text="${#lists.size(apps)} + ' 个应用'">0 个应用</span>
  </div>

  <div class="app-grid">

    <!-- ═══ Upload Card ═══ -->
    <div class="upload-card" id="uploadCard">
      <div class="upload-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <span class="upload-label" id="upload-progress">拖拽到这里上传</span>
      <span class="upload-dragover">松开以上传</span>
      <span class="upload-hint">支持 .ipa 和 .apk 文件</span>
      <input type="file" id="file-input" accept=".ipa,.apk" style="display:none" />
    </div>

    <!-- ═══ App Cards ═══ -->
    <div th:each="app : ${apps}" class="app-card" th:classappend="'card-' + ${app.platform}">
      <!-- Card Top -->
      <div class="app-card-top">
        <a class="app-card-icon" th:href="'/apps/' + ${app.id}" target="_blank">
          <img th:src="${app.icon}" alt="App Icon" loading="lazy" />
        </a>
        <div class="app-card-meta">
          <div class="app-card-name" th:data="'/apps/' + ${app.id}" th:text="${app.name}">App Name</div>
          <span class="app-card-platform" th:classappend="${#strings.containsIgnoreCase(app.platform, 'ios') ? 'ios' : 'android'}"
                th:text="${#strings.containsIgnoreCase(app.platform, 'ios') ? 'iOS' : 'Android'}">iOS</span>
        </div>
      </div>

      <!-- Details -->
      <div class="app-card-details">
        <div class="app-card-detail">
          <span class="label">短链接</span>
          <span class="value code"><a th:href="@{${baseURL}+'/s/'+${app.shortCode}}" target="_blank" th:text="'s/' + ${app.shortCode}">s/abc123</a></span>
        </div>
        <div class="app-card-detail">
          <span class="label">包名</span>
          <span class="value" th:text="${app.bundleID}">com.example.app</span>
        </div>
        <div class="app-card-detail">
          <span class="label">版本</span>
          <span class="value" th:text="${app.version} + ' (Build ' + ${app.buildVersion} + ')'">1.0 (Build 1)</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="app-card-actions">
        <a class="action-btn" th:href="'/apps/' + ${app.id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          编辑
        </a>
        <a class="action-btn" th:href="@{${baseURL}+'/s/'+${app.shortCode}}" target="_blank">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          预览
        </a>
        <span class="action-spacer"></span>
        <button class="action-btn action-delete btn-remove" th:data="${app.id}" title="删除应用">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <!-- Empty state -->
  <div th:if="${#lists.isEmpty(apps)}" style="text-align:center;padding:80px 24px;">
    <div style="font-size:48px;margin-bottom:16px;opacity:0.3;">📦</div>
    <p style="font-size:21px;font-weight:600;letter-spacing:0.231px;color:var(--apple-ink-muted-48);">还没有应用</p>
    <p style="font-size:14px;color:var(--apple-ink-muted-48);margin-top:8px;">拖拽 .ipa 或 .apk 文件到上方卡片开始上传</p>
  </div>

</main>

<script>
  /* ═══════════════════════════════════════════════════════
     CSRF Token
     ═══════════════════════════════════════════════════════ */
  var csrfToken = '[[${csrfToken}]]';

  // 所有 AJAX 请求自动携带 CSRF token
  $.ajaxSetup({
    headers: { 'X-XSRF-TOKEN': csrfToken || '' }
  });

  // Toast 默认设置
  $.toast.options.heading = '';
  $.toast.options.position = 'bottom-center';
  $.toast.options.hideAfter = 3000;

  /* ═══════════════════════════════════════════════════════
     Confirm Dialog
     ═══════════════════════════════════════════════════════ */
  function confirmAction(msg, onConfirm) {
    var overlay = document.getElementById('confirmOverlay');
    if (!overlay) return confirm(msg) && onConfirm();
    overlay.querySelector('.confirm-msg').textContent = msg;
    overlay.classList.add('active');
    overlay.querySelector('.btn-confirm').onclick = function () {
      overlay.classList.remove('active');
      onConfirm();
    };
    overlay.querySelector('.btn-cancel').onclick = function () {
      overlay.classList.remove('active');
    };
  }

  /* ═══════════════════════════════════════════════════════
     Upload & Delete Logic
     ═══════════════════════════════════════════════════════ */

  function uploadFile(file) {
    var xhr = new XMLHttpRequest();
    xhr.open("post", "/app/upload", true);
    xhr.setRequestHeader("X-Requested-With", "XMLHttpRequest");
    if (csrfToken) xhr.setRequestHeader("X-XSRF-TOKEN", csrfToken);
    xhr.upload.onprogress = function (event) {
      if (event.lengthComputable) {
        var percent = Math.floor(event.loaded / event.total * 100);
        var el = document.getElementById("upload-progress");
        if (percent < 100) {
          el.innerText = "正在上传: " + percent + "%";
        } else {
          el.innerText = "拖拽到这里上传";
        }
      }
    };
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) {
        var result = JSON.parse(xhr.response);
        console.log(result);
        var success = result.code == 0;
        $.toast({ text: result.msg, icon: success ? "success" : "error" });
        if (success) {
          window.location.href = window.location.href;
        }
      }
    };
    var fd = new FormData();
    fd.append("file", file);
    xhr.send(fd);
  }

  // ── Upload Card ──
  (function () {
    var card = document.getElementById("uploadCard");
    var input = document.getElementById("file-input");

    card.addEventListener("dragover", function (e) {
      e.preventDefault();
      card.classList.add("drag-over");
    });
    card.addEventListener("dragleave", function (e) {
      e.preventDefault();
      card.classList.remove("drag-over");
    });
    card.addEventListener("drop", function (e) {
      e.preventDefault();
      card.classList.remove("drag-over");
      var file = (this.files || e.dataTransfer.files)[0];
      if (file) uploadFile(file);
    });
    card.addEventListener("click", function () {
      input.click();
    });
    input.addEventListener("change", function () {
      if (this.files[0]) {
        uploadFile(this.files[0]);
        this.value = "";
      }
    });
  })();

  // ── Delete ──
  $(".btn-remove").click(function () {
    var url = "/app/delete/" + $(this).attr("data");
    var name = $(this).closest(".app-card").find(".app-card-name").text().trim() || "此应用";
    confirmAction("确定要删除「" + name + "」吗？删除后不可恢复。", function () {
      $.ajax({
        url: url,
        success: function (result) {
          console.log(result);
          if (result.code != 0) {
            $.toast({ text: result.msg, icon: "error" });
          } else {
            window.location.href = window.location.href;
          }
        }
      });
    });
  });

  // ── Click app name to open detail ──
  $(".app-card-name").click(function () {
    window.open($(this).attr("data"));
  });

  // ── Nav Dropdown ──
  function toggleDropdown(e) {
    if (e) e.stopPropagation();
    var el = document.querySelector('.nav-dropdown');
    if (el) el.classList.toggle('open');
  }
  document.addEventListener('click', function () {
    var el = document.querySelector('.nav-dropdown');
    if (el) el.classList.remove('open');
  });

  function copyToken() {
    var token = '[[${token}]]';
    if (navigator.clipboard) {
      navigator.clipboard.writeText(token).then(function () {
        $.toast({ text: 'Token 已复制', icon: 'info' });
      }).catch(function () {
        $.toast({ text: '复制失败', icon: 'error' });
      });
    } else {
      $.toast({ text: 'Token: ' + token, icon: 'info' });
    }
  }

  // ── Logout ──
  function logout() {
    $.get("/account/logout", function () {
      window.location.href = "/account/signin";
    });
  }
</script>

<!-- ═══ Confirm Dialog ═══ -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-dialog">
    <div class="confirm-icon">⚠️</div>
    <div class="confirm-title">确认删除</div>
    <div class="confirm-msg"></div>
    <div class="confirm-actions">
      <button class="btn-cancel">取消</button>
      <button class="btn-confirm">删除</button>
    </div>
  </div>
</div>

</body>
</html>
