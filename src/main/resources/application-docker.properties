########################################################
### Docker 环境覆盖配置
########################################################

# MySQL 连接指向 Docker Compose 中的 mysql 服务
spring.datasource.url=jdbc:mysql://mysql:3306/releaseon_app?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&autoReconnect=true&failOverReadOnly=false

# 生产环境关闭 SQL 日志
spring.jpa.show-sql=false

# 本地存储路径（挂载卷）
storage.active=local
storage.local.storagePath=/app/storage
storage.local.address=https://${server.domain}/fetch/

# 生产模式
config.debug=release

# HTTP(8081) 访问时需要允许非 Secure Cookie，否则浏览器不会发送 JSESSIONID
server.session.cookie.secure=false
